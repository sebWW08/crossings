# Render's free tier puts the site to sleep after 15 minutes without a
# request, and the next visitor then waits ~50 s on a blank page — the one
# thing a link shared into a Facebook group must not do. A request every
# 10 minutes keeps it awake for free. (GitHub runs scheduled workflows
# late when busy, and stops them in repos with no commits for 60 days.)
name: keep awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 60 https://crossings.onrender.com/api/health
